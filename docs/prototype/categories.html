<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FAFAF8" />
  <title>APM — Categories</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/mercato.css" />

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

  <!-- Shared data, navigation and UI components (ScreenLayout, AppHeader, TabBar, ProductCard, …) -->
  <script src="assets/mercato.js"></script>
</head>
<body>
<div id="root"></div>

<!-- Screen: Categories, search and filters -->
<script type="text/babel">
/* SCR-008/009/011/012 Categories: search, category chips, sort, and the filter bottom sheet.
   Opened as categories.html[?category=<slug>][&focus=search][&filters=open]. Search, sort and filters persist for the tab session. */
const SHOP_SORTS = [['featured', 'Featured'], ['low', 'Price: low to high'], ['high', 'Price: high to low'], ['rating', 'Top rated']];
const SHOP_MEMORY = (() => { try { return JSON.parse(sessionStorage.getItem('mercato_shop')) || {}; } catch (e) { return {}; } })();

function filterProducts({ category, query, sort, inStock }) {
  const q = query.trim().toLowerCase();
  const list = Mercato.products.filter(p => (!category || p.category.name === category.name)
    && (!q || p.name.toLowerCase().includes(q) || p.category.name.toLowerCase().includes(q))
    && (!inStock || p.availableQuantity > 0));
  if (sort === 'low') list.sort((a, b) => a.price.amount - b.price.amount);
  if (sort === 'high') list.sort((a, b) => b.price.amount - a.price.amount);
  if (sort === 'rating') list.sort((a, b) => b.rating - a.rating);
  if (sort === 'featured') list.sort((a, b) => Number(b.featured) - Number(a.featured));
  return list;
}

function ShopFilterSheet({ slug, sort, setSort, inStock, setInStock, count, onCategory, onClose }) {
  return <BottomSheet title="Filter & sort" onClose={onClose}>
    <p className="section-label" style={{ margin: '20px 0 10px' }}>Category</p>
    <div className="flex flex-wrap gap-2">
      <button className="chip" aria-pressed={slug === 'all'} onClick={() => onCategory('all')}>All</button>
      {Mercato.categories.map(c => <button key={c.id} className="chip" aria-pressed={slug === c.slug} onClick={() => onCategory(c.slug)}>{c.name}</button>)}
    </div>
    <p className="section-label" style={{ margin: '20px 0 10px' }}>Sort by</p>
    <div className="flex flex-wrap gap-2">{SHOP_SORTS.map(([v, t]) => <button key={v} className="chip" aria-pressed={sort === v} onClick={() => setSort(v)}>{t}</button>)}</div>
    <p className="section-label" style={{ margin: '20px 0 10px' }}>Availability</p>
    <button type="button" role="switch" aria-checked={inStock} onClick={() => setInStock(v => !v)} className="choice justify-between">
      <span><b className="block">In stock only</b><span className="t-meta">Hide sold-out products</span></span><span className="switch" />
    </button>
    <div className="sheet-actions">
      <button className="btn btn-outline" onClick={() => { setInStock(false); setSort('featured'); onCategory('all'); }}>Reset</button>
      <button className="btn btn-primary" onClick={onClose}>Show {count} {count === 1 ? 'product' : 'products'}</button>
    </div>
  </BottomSheet>;
}

function CategoriesScreen({ params, query: routeQuery, navigate, goBack }) {
  const to = Mercato.to;
  const [slug, setSlug] = React.useState(params.category || 'all');
  const [query, setQuery] = React.useState(SHOP_MEMORY.query || '');
  const [sort, setSort] = React.useState(SHOP_MEMORY.sort || 'featured');
  const [inStock, setInStock] = React.useState(!!SHOP_MEMORY.inStock);
  const [sheet, setSheet] = React.useState(routeQuery.filters === 'open');
  const loading = useLoading(350);
  const inputRef = React.useRef(null);
  React.useEffect(() => { try { sessionStorage.setItem('mercato_shop', JSON.stringify({ query, sort, inStock })); } catch (e) {} }, [query, sort, inStock]);
  const category = Mercato.categories.find(c => c.slug === slug);
  React.useEffect(() => { if (routeQuery.focus === 'search' && inputRef.current) inputRef.current.focus({ preventScroll: true }); }, []);

  const favorites = new Set(Mercato.getWishlist().map(p => p.id));
  const shown = filterProducts({ category, query, sort, inStock });
  const filtersOn = inStock || sort !== 'featured';
  const pickCategory = s => { setSlug(s); history.replaceState(null, '', to.shop(s)); }; // same page, so no reload

  return <ScreenLayout active="shop" header={<AppHeader title={category ? category.name : 'Categories'} onBack={() => goBack(to.home)}
      end={<button className="circle-btn" aria-label="Filter and sort" aria-haspopup="dialog" onClick={() => setSheet(true)}>
        <Icon name="sliders" size={20} />{filtersOn && <span className="dot-badge" style={{ background: 'var(--green-600)', minWidth: 10, height: 10, padding: 0 }} />}
      </button>} />}>

    <div className="search">
      <span className="lead"><Icon name="search" size={20} /></span>
      <input ref={inputRef} className="input" type="search" enterKeyHint="search" aria-label="Search products" placeholder="Search products" value={query} onChange={e => setQuery(e.target.value)} />
      {query && <button className="clear" aria-label="Clear search" onClick={() => { setQuery(''); inputRef.current && inputRef.current.focus(); }}><Icon name="x" size={18} /></button>}
    </div>

    <div className="chips no-scrollbar mt-4" role="group" aria-label="Categories">
      <button className="chip" aria-pressed={!category} onClick={() => pickCategory('all')}>All</button>
      {Mercato.categories.map(c => <button key={c.id} className="chip" aria-pressed={slug === c.slug} onClick={() => pickCategory(c.slug)}><Icon name={c.icon} size={16} />{c.name}</button>)}
    </div>

    <div className="flex items-center justify-between gap-3 mt-4 mb-4">
      <p className="t-meta" aria-live="polite"><b className="ink">{shown.length}</b> {shown.length === 1 ? 'product' : 'products'}{query.trim() ? ' for “' + query.trim() + '”' : ''}{inStock ? ' · in stock' : ''}</p>
      <label><span className="sr-only">Sort products</span><select className="select" value={sort} onChange={e => setSort(e.target.value)}>{SHOP_SORTS.map(([v, t]) => <option key={v} value={v}>{t}</option>)}</select></label>
    </div>

    {loading ? <ProductGridSkeleton count={4} />
      : shown.length ? <div className="grid-2">{shown.map(p => <ProductCard key={p.id} product={p} favorite={favorites.has(p.id)} onFavorite={Mercato.favoriteWithFeedback} onAdd={Mercato.addWithFeedback} />)}</div>
      : <EmptyState icon="search" title="No products found"
          text={query.trim() ? 'Nothing matches “' + query.trim() + '”. Check the spelling or try a broader term.' : 'No products match these filters.'}
          action={<button className="btn btn-primary" onClick={() => { setQuery(''); setInStock(false); pickCategory('all'); }}>Clear search & filters</button>} />}

    {sheet && <ShopFilterSheet slug={slug} sort={sort} setSort={setSort} inStock={inStock} setInStock={setInStock}
      count={filterProducts({ category, query: '', sort, inStock }).length} onCategory={pickCategory} onClose={() => setSheet(false)} />}
  </ScreenLayout>;
}

Mercato.mount(CategoriesScreen);
</script>
</body>
</html>
