<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mercato — Cart</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>body{font-family:Manrope,system-ui,sans-serif}</style><script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script><script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script><script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script></head><body class="bg-[#e9e7e2] text-slate-950 antialiased"><div id="root"></div><script type="text/babel">
const {useState}=React;
const defaults=[{id:1,name:"Minimal Watch",price:89,stock:8,cartQty:1,image:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=400&q=80"},{id:3,name:"Canvas Backpack",price:58,stock:5,cartQty:2,image:"https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=400&q=80"}];
function read(){try{const value=localStorage.getItem('mercato_cart');return value?JSON.parse(value):defaults}catch(e){return defaults}} function write(v){try{localStorage.setItem('mercato_cart',JSON.stringify(v))}catch(e){}}
function Icon({name}){const p={home:<><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10.5V20h14v-9.5"/></>,shop:<><path d="M4 9V20h16V9"/><path d="M3 9l2-5h14l2 5"/></>,heart:<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/>,bag:<><path d="M5 8h14l-1 13H6L5 8Z"/><path d="M9 9V6a3 3 0 0 1 6 0v3"/></>,user:<><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></>};return <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">{p[name]}</svg>}
function Nav(){return <nav className="fixed bottom-4 left-1/2 z-30 flex w-[calc(100%-2rem)] max-w-[416px] -translate-x-1/2 justify-around rounded-[1.7rem] border border-slate-200 bg-white/95 p-2 shadow-2xl backdrop-blur-xl">{[['home','Home','product.html'],['shop','Shop','product.html#shop'],['heart','Wishlist','wishlist.html'],['bag','Cart','#'],['user','Profile','user-profile.html']].map(([i,l,h])=><a href={h} className={(l==='Cart'?'bg-emerald-50 text-emerald-700':'text-slate-500')+' flex min-w-14 flex-col items-center gap-1 rounded-2xl px-2 py-2 text-[10px] font-bold'}><Icon name={i}/>{l}</a>)}</nav>}
function App(){const [items,setItems]=useState(read());const [notice,setNotice]=useState('');const update=(id,delta)=>{const next=items.map(x=>x.id===id?{...x,cartQty:Math.max(1,Math.min(x.stock,x.cartQty+delta))}:x);setItems(next);write(next)};const remove=id=>{if(confirm('Remove this product from your cart?')){const next=items.filter(x=>x.id!==id);setItems(next);write(next);setNotice('Product removed')}};const subtotal=items.reduce((s,x)=>s+x.price*x.cartQty,0);
return <div className="mx-auto min-h-screen max-w-md bg-[#fbfaf7] pb-32 shadow-2xl"><header className="flex h-24 items-center border-b border-slate-200 bg-white px-5 text-slate-950"><div className="flex w-full items-center justify-between"><div><p className="text-[10px] font-extrabold tracking-[.2em] text-emerald-600">YOUR BAG</p><h1 className="mt-1 text-2xl font-extrabold tracking-tight">Shopping cart</h1></div><span className="rounded-full border border-slate-200 bg-slate-50 px-3 py-2 text-xs font-bold backdrop-blur">{items.length} items</span></div></header>{notice&&<p className="mx-5 mt-4 mb-0 rounded-2xl bg-emerald-100 p-3 text-sm font-bold text-emerald-700 shadow-lg">{notice}</p>}
<main className="px-5 pt-6">{items.length?<><div className="space-y-4">{items.map(item=><article key={item.id} className="flex gap-4 rounded-[1.7rem] bg-white p-3 shadow-[0_12px_40px_rgba(15,23,42,.09)]"><img src={item.image} className="h-28 w-28 rounded-[1.35rem] object-cover"/><div className="min-w-0 flex-1 py-1"><div className="flex justify-between gap-2"><div><h2 className="truncate font-extrabold">{item.name}</h2><p className="mt-1 text-xs font-semibold text-emerald-600">{item.stock} in stock</p></div><button onClick={()=>remove(item.id)} className="grid h-8 w-8 place-items-center rounded-full bg-slate-100 text-lg text-slate-400">×</button></div><div className="mt-4 flex items-center justify-between"><b className="text-lg">${item.price}</b><div className="flex items-center rounded-xl bg-slate-100"><button disabled={item.cartQty===1} onClick={()=>update(item.id,-1)} className="px-3 py-2 disabled:opacity-30">−</button><span className="min-w-6 text-center text-sm font-bold">{item.cartQty}</span><button disabled={item.cartQty>=item.stock} onClick={()=>update(item.id,1)} className="px-3 py-2 disabled:opacity-30">+</button></div></div></div></article>)}</div><section className="mt-7 rounded-[2rem] border border-slate-200 bg-white p-6 text-slate-950 shadow-lg"><p className="text-[10px] font-bold tracking-[.2em] text-emerald-600">ORDER SUMMARY</p><div className="mt-5 flex justify-between text-sm text-slate-400"><span>Subtotal</span><span>${subtotal.toFixed(2)}</span></div><div className="mt-3 flex justify-between text-sm text-slate-400"><span>Delivery</span><span>Calculated at checkout</span></div><div className="my-5 border-t border-slate-200"></div><div className="flex justify-between text-2xl font-extrabold"><span>Total</span><span>${subtotal.toFixed(2)}</span></div><a href="orders.html#checkout" className="mt-5 block rounded-2xl bg-slate-950 py-4 text-center font-extrabold text-white shadow-lg shadow-emerald-400/20">Secure checkout →</a></section></>:<section className="mt-20 text-center"><div className="mx-auto grid h-24 w-24 place-items-center rounded-full bg-emerald-100 text-5xl">🛍</div><h2 className="mt-5 text-2xl font-extrabold">Your cart is empty</h2><p className="mt-2 text-sm text-slate-500">Discover something you’ll love and add it here.</p><a href="product.html#shop" className="mt-6 inline-block rounded-2xl bg-slate-950 px-6 py-3 font-bold text-white shadow-xl">Explore the shop</a></section>}</main><Nav/></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script><style>
/* Mercato palette: emerald actions, slate typography, warm off-white surfaces. */
body{background:#dfe9e3!important;color:#0f172a}#root>div{background:#f7faf8!important}.bg-slate-950{background-color:#047857!important}.bg-slate-950 .text-slate-400{color:#d1fae5!important}
</style></body></html>
