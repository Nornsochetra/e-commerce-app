<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mercato — Profile</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>body{font-family:Manrope,system-ui,sans-serif}</style><script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script><script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script><script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script></head><body class="bg-[#e9e7e2] text-slate-950 antialiased"><div id="root"></div><script type="text/babel">
const {useState}=React;const field="w-full rounded-2xl border border-slate-200 px-4 py-3 outline-none focus:border-emerald-500";
function Icon({name}){const p={home:<><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10.5V20h14v-9.5"/></>,shop:<><path d="M4 9V20h16V9"/><path d="M3 9l2-5h14l2 5"/></>,heart:<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/>,bag:<><path d="M5 8h14l-1 13H6L5 8Z"/><path d="M9 9V6a3 3 0 0 1 6 0v3"/></>,user:<><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></>};return <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">{p[name]}</svg>}
function Nav(){return <nav className="fixed bottom-4 left-1/2 z-30 flex w-[calc(100%-2rem)] max-w-[416px] -translate-x-1/2 justify-around rounded-[1.7rem] border border-slate-200 bg-white/95 p-2 shadow-2xl backdrop-blur-xl">{[['home','Home','product.html'],['shop','Shop','product.html#shop'],['heart','Wishlist','wishlist.html'],['bag','Cart','shopping-cart.html'],['user','Profile','#']].map(([i,l,h])=><a href={h} className={(l==='Profile'?'bg-emerald-50 text-emerald-700':'text-slate-500')+' flex min-w-14 flex-col items-center gap-1 rounded-2xl px-2 py-2 text-[10px] font-bold'}><Icon name={i}/>{l}</a>)}</nav>}
function App(){const [edit,setEdit]=useState(false),[saved,setSaved]=useState(false),[user,setUser]=useState({name:'Alex Morgan',email:'alex@example.com',phone:'+855 12 345 678'});const [draft,setDraft]=useState(user);const submit=e=>{e.preventDefault();setUser(draft);setEdit(false);setSaved(true);setTimeout(()=>setSaved(false),1800)};
return <div className="mx-auto min-h-screen max-w-md bg-[#fbfaf7] pb-32 shadow-2xl"><header className="flex h-24 items-center border-b border-slate-200 bg-white px-5 text-slate-950"><div className="flex w-full justify-between"><div><p className="text-[10px] font-extrabold tracking-[.2em] text-emerald-600">MY ACCOUNT</p><h1 className="mt-1 text-2xl font-extrabold tracking-tight">Profile</h1></div></div></header><main className="px-5 pt-6">{saved&&<p className="mb-3 rounded-2xl bg-emerald-100 p-3 text-sm font-bold text-emerald-700 shadow-lg">Profile updated successfully.</p>}{!edit?<><section className="rounded-[2rem] bg-white p-5 shadow-[0_16px_50px_rgba(15,23,42,.13)]"><div className="flex items-center gap-4"><div className="grid h-20 w-20 place-items-center rounded-[1.6rem] bg-emerald-50 text-2xl font-extrabold text-emerald-700 ring-1 ring-emerald-100">AM</div><div><p className="text-[10px] font-bold tracking-wider text-emerald-600">MEMBER SINCE 2026</p><h2 className="mt-1 text-xl font-extrabold">{user.name}</h2><p className="text-sm text-slate-500">{user.email}</p></div></div><button onClick={()=>{setDraft(user);setEdit(true)}} className="mt-5 w-full rounded-2xl bg-slate-100 py-3 font-bold transition hover:bg-slate-200">Edit profile</button></section><section className="mt-5 overflow-hidden rounded-[2rem] bg-white p-2 shadow-sm">{[['Orders','Review history and delivery status','orders.html#history','03'],['Wishlist','Your curated favorites','wishlist.html','♡'],['Shopping cart','Items ready for checkout','shopping-cart.html','02']].map(([a,b,h,n])=><a href={h} className="flex items-center justify-between rounded-[1.4rem] p-4 transition hover:bg-slate-50"><div className="flex items-center gap-4"><span className="grid h-11 w-11 place-items-center rounded-2xl bg-slate-100 text-xs font-extrabold">{n}</span><div><p className="font-extrabold">{a}</p><p className="text-xs text-slate-400">{b}</p></div></div><span className="text-slate-400">→</span></a>)}</section><section className="mt-5 rounded-[2rem] bg-amber-50 border border-amber-100 p-5"><p className="text-[10px] font-extrabold tracking-[.18em] text-amber-700">MEMBER BENEFIT</p><h3 className="mt-2 font-extrabold">Free delivery on your next order</h3><p className="mt-1 text-xs text-slate-500">A prototype loyalty offer for visual review.</p></section><button onClick={() => location.href="authentication.html"} className="mt-6 w-full rounded-2xl border border-rose-200 bg-white py-4 font-bold text-rose-600 transition hover:bg-rose-50">Sign out</button></>:<section className="rounded-[2rem] bg-white p-5 shadow-xl"><button onClick={()=>setEdit(false)} className="text-sm font-bold text-slate-500">← Cancel</button><h2 className="mt-4 text-2xl font-extrabold">Edit profile</h2><form onSubmit={submit} className="mt-6 space-y-4"><label className="block text-sm font-bold">Full name<input required className={field+' mt-2'} value={draft.name} onChange={e=>setDraft({...draft,name:e.target.value})}/></label><label className="block text-sm font-bold">Email<input required type="email" className={field+' mt-2'} value={draft.email} onChange={e=>setDraft({...draft,email:e.target.value})}/></label><label className="block text-sm font-bold">Phone<input className={field+' mt-2'} value={draft.phone} onChange={e=>setDraft({...draft,phone:e.target.value})}/></label><button className="w-full rounded-2xl bg-slate-950 py-4 font-extrabold text-white shadow-xl">Save changes</button></form></section>}</main><Nav/></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script><style>
/* Mercato palette: emerald actions, slate typography, warm off-white surfaces. */
body{background:#dfe9e3!important;color:#0f172a}#root>div{background:#f7faf8!important}.bg-slate-950{background-color:#047857!important}.border-rose-200{border-color:#a7f3d0!important}.bg-rose-50{background-color:#ecfdf5!important}.text-rose-600{color:#047857!important}
</style></body></html>
