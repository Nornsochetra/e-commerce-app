<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FAFAF8" />
  <title>APM — All screens</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/mercato.css" />

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

  <!-- Shared data, navigation and UI components (ScreenLayout, AppHeader, TabBar, ProductCard, …) -->
  <script src="assets/mercato.js"></script>
</head>
<body>
<div id="root"></div>

<!-- Screen: Index of every screen (for reviewers) -->
<script type="text/babel">
/* Developer index of every screen (screens.html). Not part of the shopping app itself. */
function ScreenIndexScreen() {
  const to = Mercato.to;
  const screens = [
    ['Splash', 'Brand intro, then sign in or home', to.splash, 'leaf', () => { try { sessionStorage.removeItem('mercato_splash'); } catch (e) {} }],
    ['Sign in', 'Demo account, validation, guest access', to.login, 'user'],
    ['Create account', 'Registration with password strength', to.register, 'edit'],
    ['Reset password', 'Recovery request and acknowledgement', to.forgotPassword, 'lock'],
    ['Home', 'Search, featured collections, trending', to.home, 'home'],
    ['Categories & search', 'Browse, filter and sort products', to.shop(), 'grid'],
    ['Product details', 'Images, stock, quantity, add to cart', to.product(Mercato.products[0].id), 'tag'],
    ['Cart', 'Quantities, removal and totals', to.cart, 'bag'],
    ['Checkout', 'Delivery details and place order', to.checkout, 'truck'],
    ['My orders', 'History with status filters', to.orders, 'box'],
    ['Order details', 'Progress timeline, items, payment', to.order('d1984200-0000-4000-8000-000000000002'), 'pin'],
    ['Wishlist', 'Saved products and quick add', to.wishlist, 'heart'],
    ['Notifications', 'Read, unread, filters and clear', to.notifications, 'bell'],
    ['Profile', 'Account, edit profile and log out', to.profile, 'settings']
  ];
  return <main className="page" style={{ paddingTop: 24 }}>
    <div className="flex items-center justify-between"><Brand href={to.home} /><span className="badge success">Prototype</span></div>
    <h1 className="t-display mt-8">All screens</h1>
    <p className="t-body muted mt-2">Jump to any screen. Data is saved in this browser only; no real accounts, payments or orders are created.</p>
    <div className="mt-6">{screens.map(([title, text, href, icon, onClick]) => <a key={title} href={href} onClick={onClick} className="launch-card">
      <span className="icon-tile"><Icon name={icon} size={20} /></span>
      <span className="flex-1 min-w-0"><b className="block t-head">{title}</b><span className="t-meta">{text}</span></span>
      <Icon name="chevron" size={18} className="faint" />
    </a>)}</div>
    <p className="t-meta mt-6">Demo sign-in: <b className="ink">demo@apm.app</b> / <b className="ink">Demo123!</b> · Reset saved data from Profile → Reset demo data.</p>
  </main>;
}

Mercato.mount(ScreenIndexScreen);
</script>
</body>
</html>
