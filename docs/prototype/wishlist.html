<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FAFAF8" />
  <title>Mercato — Wishlist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/mercato.css" />

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

  <!-- Shared data, navigation and UI components (ScreenLayout, AppHeader, TabBar, ProductCard, …) -->
  <script src="assets/mercato.js"></script>
</head>
<body>
<div id="root"></div>

<!-- Screen: Wishlist -->
<script type="text/babel">
/* SCR-014 Wishlist: saved products, remove with undo, add one or all in-stock items to the cart. */
function WishlistScreen() {
  const to = Mercato.to;
  const loading = useLoading(300);
  const items = Mercato.getWishlist();
  const inStock = items.filter(p => p.availableQuantity > 0);

  const remove = p => {
    const index = items.findIndex(x => x.id === p.id);
    Mercato.saveWishlist(items.filter(x => x.id !== p.id));
    Mercato.toast('Removed from wishlist', { label: 'Undo', onClick: () => { const now = Mercato.getWishlist().slice(); now.splice(Math.min(index, now.length), 0, p); Mercato.saveWishlist(now); } });
  };
  const addAll = () => {
    inStock.forEach(p => Mercato.addToCart(p, 1));
    Mercato.toast('Added ' + inStock.length + (inStock.length === 1 ? ' item' : ' items') + ' to cart', { label: 'View cart', onClick: () => Mercato.go(to.cart) });
  };

  return <ScreenLayout active="wishlist" header={<AppHeader title="Wishlist" sub={items.length ? items.length + ' saved' : undefined} />}>
    {loading ? <ListSkeleton count={3} />
      : items.length ? <>
        <section aria-label="Saved products">{items.map(p => <ListCard key={p.id} product={p} favorite onFavorite={remove} onAdd={x => Mercato.addWithFeedback(x, 1)} />)}</section>
        {inStock.length > 1 && <button className="btn btn-secondary btn-block mt-5" onClick={addAll}><Icon name="cart" size={18} />Add all in stock to cart ({inStock.length})</button>}
      </>
      : <EmptyState icon="heart" tone="rose" title="Nothing saved yet" text="Tap the heart on any product to keep it here for later." action={<a href={to.shop()} className="btn btn-primary">Discover products</a>} />}
  </ScreenLayout>;
}

Mercato.mount(WishlistScreen);
</script>
</body>
</html>
