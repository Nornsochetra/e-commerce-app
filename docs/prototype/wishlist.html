<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mercato — Wishlist</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>body{font-family:Manrope,system-ui,sans-serif}</style><script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script><script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script><script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script></head><body class="bg-[#e9e7e2] text-slate-950 antialiased"><div id="root"></div><script type="text/babel">
const {useState}=React;const defaults=[{id:2,name:"Cloud Sneakers",category:"Footwear",price:74,rating:4.6,stock:12,image:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=600&q=80"},{id:5,name:"Classic Sunglasses",category:"Accessories",price:42,rating:4.5,stock:16,image:"https://images.unsplash.com/photo-1511499767150-a48a237f0083?auto=format&fit=crop&w=600&q=80"}];
function get(k,d=[]){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}function put(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function Icon({name}){const p={home:<><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10.5V20h14v-9.5"/></>,shop:<><path d="M4 9V20h16V9"/><path d="M3 9l2-5h14l2 5"/></>,heart:<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/>,bag:<><path d="M5 8h14l-1 13H6L5 8Z"/><path d="M9 9V6a3 3 0 0 1 6 0v3"/></>,user:<><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></>};return <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">{p[name]}</svg>}
function Nav(){return <nav className="fixed bottom-4 left-1/2 z-30 flex w-[calc(100%-2rem)] max-w-[416px] -translate-x-1/2 justify-around rounded-[1.7rem] border border-slate-200 bg-white/95 p-2 shadow-2xl backdrop-blur-xl">{[['home','Home','product.html'],['shop','Shop','product.html#shop'],['heart','Wishlist','#'],['bag','Cart','shopping-cart.html'],['user','Profile','user-profile.html']].map(([i,l,h])=><a href={h} className={(l==='Wishlist'?'bg-rose-50 text-rose-600':'text-slate-500')+' flex min-w-14 flex-col items-center gap-1 rounded-2xl px-2 py-2 text-[10px] font-bold'}><Icon name={i}/>{l}</a>)}</nav>}
function App(){const [items,setItems]=useState(get('mercato_wishlist',defaults));const [toast,setToast]=useState('');const remove=id=>{const n=items.filter(x=>x.id!==id);setItems(n);put('mercato_wishlist',n)};const add=p=>{const c=get('mercato_cart');const found=c.find(x=>x.id===p.id);const n=found?c:[...c,{...p,cartQty:1}];put('mercato_cart',n);setToast('Added to cart');setTimeout(()=>setToast(''),1500)};
return <div className="mx-auto min-h-screen max-w-md bg-[#fbfaf7] pb-32 shadow-2xl"><header className="flex h-24 flex-col justify-center border-b border-slate-200 bg-white px-5"><p className="relative text-[10px] font-extrabold tracking-[.2em] text-rose-500">SAVED FOR LATER</p><div className="relative flex items-end justify-between"><h1 className="mt-1 text-2xl font-extrabold tracking-tight">Your wishlist</h1><span className="rounded-full bg-white/70 px-3 py-2 text-xs font-bold shadow-sm">{items.length} saved</span></div></header><main className="px-5 pt-6">{items.length?<div className="grid grid-cols-2 gap-4">{items.map(p=><article key={p.id} className="overflow-hidden rounded-[1.7rem] bg-white shadow-[0_12px_40px_rgba(15,23,42,.08)]"><div className="relative overflow-hidden"><img src={p.image} className="h-52 w-full object-cover transition duration-500 hover:scale-105"/><button onClick={()=>remove(p.id)} className="absolute right-3 top-3 grid h-10 w-10 place-items-center rounded-full bg-white/90 text-rose-500 shadow-lg backdrop-blur">♥</button><span className="absolute bottom-3 left-3 rounded-full bg-slate-950/80 px-2.5 py-1 text-[10px] font-bold text-white backdrop-blur">{p.category}</span></div><div className="p-4"><p className="truncate font-extrabold">{p.name}</p><p className="mt-1 text-xs font-semibold text-amber-500">★ {p.rating} <span className="text-slate-400">· {p.stock} left</span></p><div className="mt-4 flex items-center justify-between"><b className="text-lg">${p.price}</b><button disabled={!p.stock} onClick={()=>add(p)} className="rounded-xl bg-slate-950 px-3 py-2 text-xs font-bold text-white shadow-lg disabled:bg-slate-300">Add to bag</button></div></div></article>)}</div>:<section className="mt-24 text-center"><div className="mx-auto grid h-24 w-24 place-items-center rounded-full bg-rose-100 text-5xl text-rose-500">♡</div><h2 className="mt-5 text-2xl font-extrabold">Nothing saved yet</h2><p className="mt-2 text-sm text-slate-500">Tap the heart on products you want to remember.</p><a href="product.html#shop" className="mt-6 inline-block rounded-2xl bg-slate-950 px-6 py-3 font-bold text-white shadow-xl">Browse the shop</a></section>}</main>{toast&&<div className="fixed left-1/2 top-5 z-50 -translate-x-1/2 rounded-full bg-emerald-500 px-5 py-3 text-sm font-bold text-white shadow-xl">{toast}</div>}<Nav/></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script><style>
/* Mercato palette: emerald actions, slate typography, warm off-white surfaces. */
body{background:#dfe9e3!important;color:#0f172a}#root>div{background:#f7faf8!important}.bg-slate-950{background-color:#047857!important}.bg-rose-50{background-color:#ecfdf5!important}.bg-rose-100{background-color:#d1fae5!important}.text-rose-500,.text-rose-600{color:#047857!important}
</style></body></html>
