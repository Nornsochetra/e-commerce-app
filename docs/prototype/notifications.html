<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FAFAF8" />
  <title>APM — Notifications</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/mercato.css" />

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

  <!-- Shared data, navigation and UI components (ScreenLayout, AppHeader, TabBar, ProductCard, …) -->
  <script src="assets/mercato.js"></script>
</head>
<body>
<div id="root"></div>

<!-- Screen: Notifications -->
<script type="text/babel">
/* SCR-019 Notifications: Today/Earlier groups, type filters, mark read, clear with undo, deep links. */
const NOTIF_TYPES = { order: { icon: 'box', tone: 'info', text: 'Order' }, offer: { icon: 'tag', tone: 'warning', text: 'Offer' }, stock: { icon: 'bell', tone: '', text: 'Back in stock' } };
const NOTIF_FILTERS = [['all', 'All'], ['unread', 'Unread'], ['order', 'Orders'], ['offer', 'Offers'], ['stock', 'Stock']];

/** Deep-link each notification to the most relevant screen. */
function notificationTarget(n) {
  const to = Mercato.to;
  if (n.type === 'order') {
    const ref = (n.message.match(/#(MC-\d+)/) || [])[1];
    const order = ref && Mercato.getOrders().find(o => o.reference === ref);
    return order ? to.order(order.id) : to.orders;
  }
  if (n.type === 'stock') {
    const p = Mercato.products.find(x => n.message.includes(x.name));
    return p ? to.product(p.id) : to.wishlist;
  }
  return to.shop();
}

function NotificationItem({ n, onRead }) {
  const t = NOTIF_TYPES[n.type] || NOTIF_TYPES.order, unread = !n.readAt;
  return <li className={'notif' + (unread ? ' unread' : '')}>
    <span className={'icon-tile ' + t.tone}><Icon name={t.icon} size={20} /></span>
    <div className="flex-1 min-w-0">
      <a href={notificationTarget(n)} className="notif-main block" onClick={() => onRead(n.id)}>
        <span className="flex items-start gap-2"><b className="flex-1" style={{ fontSize: 14, lineHeight: '20px' }}>{n.title}{unread && <span className="sr-only"> (unread)</span>}</b>{unread && <span className="unread-dot" aria-hidden="true" />}</span>
        <span className="t-body muted block mt-0.5">{n.message}</span>
      </a>
      <div className="flex items-center justify-between gap-2 mt-1.5">
        <span className="t-meta"><time dateTime={n.createdAt}>{Mercato.relTime(n.createdAt)}</time> · {t.text}</span>
        {unread && <button className="link" style={{ minHeight: 32, fontSize: 12 }} onClick={() => onRead(n.id)}>Mark as read</button>}
      </div>
    </div>
  </li>;
}

function NotificationsScreen({ goBack }) {
  const to = Mercato.to;
  const loading = useLoading(300);
  const [filter, setFilter] = React.useState('all');
  const items = Mercato.getNotifications();
  const unread = items.filter(n => !n.readAt).length;
  const counts = { all: items.length, unread, order: 0, offer: 0, stock: 0 };
  items.forEach(n => { counts[n.type] = (counts[n.type] || 0) + 1; });
  const shown = filter === 'all' ? items : filter === 'unread' ? items.filter(n => !n.readAt) : items.filter(n => n.type === filter);
  const today = shown.filter(n => Date.now() - new Date(n.createdAt) < 864e5), earlier = shown.filter(n => !today.includes(n));

  const now = () => new Date().toISOString();
  const markRead = id => { if (items.some(n => n.id === id && !n.readAt)) Mercato.saveNotifications(items.map(n => n.id === id ? { ...n, readAt: now() } : n)); };
  const markAll = () => { const t = now(); Mercato.saveNotifications(items.map(n => ({ ...n, readAt: n.readAt || t }))); Mercato.toast('All caught up'); };
  const clearAll = () => { const prev = items; Mercato.saveNotifications([]); Mercato.toast('Notifications cleared', { label: 'Undo', onClick: () => Mercato.saveNotifications(prev) }); };
  const group = (title, list) => list.length > 0 && <>
    <h2 className="section-label">{title}</h2>
    <ul className="card flush">{list.map(n => <NotificationItem key={n.id} n={n} onRead={markRead} />)}</ul>
  </>;

  return <ScreenLayout header={<AppHeader title="Notifications" sub={unread ? unread + ' unread' : undefined} onBack={() => goBack(to.home)}
      end={<button className="circle-btn" aria-label="Mark all as read" disabled={!unread} style={!unread ? { opacity: .4 } : undefined} onClick={markAll}><Icon name="checkall" size={20} /></button>} />}>
    {items.length > 0 && <div className="chips no-scrollbar" role="group" aria-label="Filter notifications">
      {NOTIF_FILTERS.map(([v, t]) => <button key={v} className="chip" aria-pressed={filter === v} onClick={() => setFilter(v)}>{t}{counts[v] > 0 && v !== 'all' && <span className="count">{counts[v]}</span>}</button>)}
    </div>}
    {loading ? <div className="card flush mt-4" aria-busy="true">{[0, 1, 2].map(i => <div key={i} className="notif"><div className="skeleton icon-tile" /><div className="flex-1"><div className="skeleton" style={{ height: 14, width: '60%' }} /><div className="skeleton mt-2" style={{ height: 12, width: '90%' }} /></div></div>)}</div>
      : shown.length ? <>
        {group('Today', today)}{group('Earlier', earlier)}
        <div className="text-center mt-4"><button className="link muted" onClick={clearAll}><Icon name="trash" size={16} />Clear all notifications</button></div>
      </>
      : items.length ? <EmptyState icon="checkall" title={filter === 'unread' ? 'You’re all caught up' : 'Nothing here yet'}
          text={filter === 'unread' ? 'You’ve read every update. Older ones are under All.' : 'Updates of this type will appear here.'}
          action={<button className="btn btn-outline" onClick={() => setFilter('all')}>Show all</button>} />
      : <EmptyState icon="bell" title="No notifications" text="Order updates, offers and restocks will show up here." action={<a href={to.shop()} className="btn btn-primary">Explore products</a>} />}
  </ScreenLayout>;
}

Mercato.mount(NotificationsScreen);
</script>
</body>
</html>
