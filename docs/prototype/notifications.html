<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mercato — Notifications</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <style>body{font-family:Manrope,system-ui,sans-serif}</style>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="min-h-screen bg-[#dfe9e3] text-slate-900 antialiased">
  <div id="root"></div>
  <script type="text/babel">
    const {useMemo, useState} = React;

    const defaults = [
      {
        id: 1,
        type: "order",
        title: "Your order is on the way",
        message: "Order #MC-19842 has shipped and is moving toward Phnom Penh.",
        time: "12 min ago",
        read: false
      },
      {
        id: 2,
        type: "offer",
        title: "A little something for you",
        message: "Enjoy free standard delivery on your next mock order.",
        time: "2 hours ago",
        read: false
      },
      {
        id: 3,
        type: "stock",
        title: "Back in stock",
        message: "Cloud Sneakers from your wishlist are available again.",
        time: "Yesterday",
        read: true
      },
      {
        id: 4,
        type: "order",
        title: "Order delivered",
        message: "Order #MC-20481 was delivered. We hope you enjoy it.",
        time: "Aug 18",
        read: true
      }
    ];

    function loadNotifications() {
      try {
        const saved = localStorage.getItem("mercato_notifications");
        return saved ? JSON.parse(saved) : defaults;
      } catch (error) {
        return defaults;
      }
    }

    function saveNotifications(items) {
      try { localStorage.setItem("mercato_notifications", JSON.stringify(items)); } catch (error) {}
    }

    function Icon({name}) {
      const paths = {
        home: <><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10.5V20h14v-9.5"/></>,
        shop: <><path d="M4 9V20h16V9"/><path d="M3 9l2-5h14l2 5"/></>,
        heart: <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/>,
        bag: <><path d="M5 8h14l-1 13H6L5 8Z"/><path d="M9 9V6a3 3 0 0 1 6 0v3"/></>,
        user: <><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></>
      };
      return <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">{paths[name]}</svg>;
    }

    function Nav() {
      const items = [
        ["home", "Home", "product.html"],
        ["shop", "Shop", "product.html#shop"],
        ["heart", "Wishlist", "wishlist.html"],
        ["bag", "Cart", "shopping-cart.html"],
        ["user", "Profile", "user-profile.html"]
      ];
      return <nav className="fixed bottom-4 left-1/2 z-30 flex w-[calc(100%-2rem)] max-w-[416px] -translate-x-1/2 justify-around rounded-[1.7rem] border border-slate-200 bg-white/95 p-2 shadow-2xl backdrop-blur-xl">
        {items.map(([icon, label, href]) => <a key={label} href={href} className="flex min-w-14 flex-col items-center gap-1 rounded-2xl px-2 py-2 text-[10px] font-bold text-slate-500"><Icon name={icon}/>{label}</a>)}
      </nav>;
    }

    function App() {
      const [items, setItems] = useState(loadNotifications);
      const [filter, setFilter] = useState("all");
      const unread = items.filter(item => !item.read).length;
      const shown = useMemo(() => filter === "unread" ? items.filter(item => !item.read) : items, [items, filter]);

      const update = next => { setItems(next); saveNotifications(next); };
      const markRead = id => update(items.map(item => item.id === id ? {...item, read: true} : item));
      const markAllRead = () => update(items.map(item => ({...item, read: true})));
      const clearAll = () => update([]);
      const icon = type => type === "order" ? "✓" : type === "offer" ? "%" : "↗";

      return <div className="mx-auto min-h-screen max-w-md bg-[#f7faf8] pb-32 shadow-2xl">
        <header className="border-b border-slate-200 bg-white px-5 pb-5 pt-6">
          <div className="flex items-center justify-between">
            <a href="product.html" className="grid h-10 w-10 place-items-center rounded-xl bg-slate-100 font-bold text-slate-600" aria-label="Back to products">←</a>
            <button onClick={clearAll} disabled={!items.length} className="text-xs font-bold text-slate-500 disabled:opacity-30">Clear all</button>
          </div>
          <div className="mt-5 flex items-end justify-between">
            <div><p className="text-[10px] font-extrabold tracking-[.2em] text-emerald-700">STAY UPDATED</p><h1 className="mt-1 text-2xl font-extrabold tracking-tight">Notifications</h1></div>
            <span className="rounded-full bg-emerald-50 px-3 py-2 text-xs font-bold text-emerald-700">{unread} unread</span>
          </div>
        </header>

        <main className="px-5 pt-6">
          <div className="flex items-center justify-between">
            <div className="flex rounded-xl bg-emerald-50 p-1">
              {[['all','All'],['unread','Unread']].map(([id,label]) => <button key={id} onClick={() => setFilter(id)} className={(filter === id ? 'bg-emerald-700 text-white shadow-sm' : 'text-slate-500') + ' rounded-lg px-4 py-2 text-xs font-bold transition'}>{label}</button>)}
            </div>
            <button onClick={markAllRead} disabled={!unread} className="text-xs font-bold text-emerald-700 disabled:opacity-30">Mark all read</button>
          </div>

          {shown.length ? <div className="mt-5 space-y-3">
            {shown.map(item => <article key={item.id} className={(item.read ? 'border-slate-100 bg-white' : 'border-emerald-200 bg-emerald-50/70') + ' rounded-[1.6rem] border p-4 shadow-[0_10px_30px_rgba(15,23,42,.06)]'}>
              <div className="flex gap-3">
                <div className={(item.type === 'offer' ? 'bg-amber-100 text-amber-700' : 'bg-emerald-100 text-emerald-700') + ' grid h-11 w-11 shrink-0 place-items-center rounded-2xl font-black'}>{icon(item.type)}</div>
                <div className="min-w-0 flex-1">
                  <div className="flex items-start justify-between gap-3"><h2 className="text-sm font-extrabold">{item.title}</h2>{!item.read && <span className="mt-1.5 h-2 w-2 shrink-0 rounded-full bg-emerald-600"></span>}</div>
                  <p className="mt-1 text-xs leading-5 text-slate-500">{item.message}</p>
                  <div className="mt-3 flex items-center justify-between"><span className="text-[10px] font-bold text-slate-400">{item.time}</span>{!item.read && <button onClick={() => markRead(item.id)} className="text-[10px] font-bold text-slate-500">Mark read</button>}</div>
                </div>
              </div>
            </article>)}
          </div> : <section className="mt-20 text-center">
            <div className="mx-auto grid h-24 w-24 place-items-center rounded-full bg-emerald-100 text-4xl text-emerald-700">✓</div>
            <h2 className="mt-5 text-xl font-extrabold">You’re all caught up</h2>
            <p className="mt-2 text-sm text-slate-500">New order and shopping updates will appear here.</p>
            <a href="product.html#shop" className="mt-6 inline-block rounded-2xl bg-emerald-700 px-6 py-3 text-sm font-bold text-white shadow-lg shadow-emerald-700/20">Explore products</a>
          </section>}
        </main>
        <Nav/>
      </div>;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
