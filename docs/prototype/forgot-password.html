<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FAFAF8" />
  <title>APM — Reset password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/mercato.css" />

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

  <!-- Shared data, navigation and UI components (ScreenLayout, AppHeader, TabBar, ProductCard, …) -->
  <script src="assets/mercato.js"></script>
</head>
<body>
<div id="root"></div>

<!-- Screen: Reset password -->
<script type="text/babel">
/* SCR-004 Forgot password. Always shows the same acknowledgement (doesn't reveal whether an account exists). */
function ForgotPasswordScreen({ goBack }) {
  const to = Mercato.to;
  const f = useForm({ email: '' }, v => (RULES.email(v.email) ? { email: RULES.email(v.email) } : {}));
  const [loading, setLoading] = React.useState(false);
  const [sent, setSent] = React.useState(false);
  const submit = e => {
    e.preventDefault();
    if (loading) return;
    f.touchAll();
    if (!f.valid) { f.focusFirstError(); return; }
    setLoading(true);
    setTimeout(() => { setLoading(false); setSent(true); }, 700);
  };
  return <AuthLayout onBack={() => goBack(to.login)}>
    <section aria-labelledby="forgot-title">
      <span className="icon-tile lg"><Icon name={sent ? 'mail' : 'lock'} size={24} /></span>
      <h1 id="forgot-title" className="t-display mt-4">{sent ? 'Check your email' : 'Reset password'}</h1>
      {sent ? <>
        <p className="t-body muted mt-2">If an account exists for <b className="ink">{f.values.email.trim()}</b>, we’ve sent instructions to reset the password.</p>
        <p className="alert info mt-5" role="status"><Icon name="info" size={18} />This prototype doesn’t send real email.</p>
        <a href={to.login} className="btn btn-primary btn-block mt-6">Back to sign in</a>
        <button className="btn btn-block mt-2" style={{ color: 'var(--text-2)' }} onClick={() => setSent(false)}>Use a different email</button>
      </> : <>
        <p className="t-body muted mt-2">Enter the email you use for APM and we’ll send reset instructions.</p>
        <form className="flex flex-col gap-4 mt-6" onSubmit={submit} noValidate>
          <TextField id="fp-email" label="Email" type="email" inputMode="email" autoComplete="email" enterKeyHint="send" placeholder="you@example.com" maxLength={255}
            value={f.values.email} onChange={f.set('email')} onBlur={f.blur('email')} error={f.shown('email')} />
          <button className="btn btn-primary btn-block" disabled={loading}>{loading ? <Spinner text="Sending…" /> : 'Send instructions'}</button>
        </form>
      </>}
    </section>
  </AuthLayout>;
}

Mercato.mount(ForgotPasswordScreen);
</script>
</body>
</html>
