<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mercato — Authentication</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <style>body{font-family:Manrope,system-ui,sans-serif}</style>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="min-h-screen bg-[#dfe9e3] text-slate-900 antialiased">
  <div id="root"></div>
  <script type="text/babel">
    const { useEffect, useState } = React;
    const fieldClass = "w-full rounded-2xl border border-slate-200 bg-white px-4 py-3.5 outline-none transition focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10";

    function Brand() {
      return <div className="flex items-center gap-3"><div className="grid h-12 w-12 place-items-center rounded-[1.1rem] bg-emerald-700 font-extrabold text-white shadow-xl shadow-emerald-700/20">M</div><div><p className="font-extrabold tracking-tight">Mercato</p><p className="text-[10px] font-bold tracking-wider text-slate-400">EVERYDAY, MADE BETTER</p></div></div>;
    }

    function App() {
      const [screen, setScreen] = useState("splash");
      const [loading, setLoading] = useState(false);
      const [message, setMessage] = useState("");
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      useEffect(() => { if (screen === "splash") { const id = setTimeout(() => setScreen("login"), 1200); return () => clearTimeout(id); } }, [screen]);
      const submit = (event, text, destination) => {
        event.preventDefault(); setLoading(true); setMessage("");
        setTimeout(() => { setLoading(false); setMessage(text); if (destination) setTimeout(() => location.href = destination, 500); }, 650);
      };

      if (screen === "splash") return <div className="relative grid min-h-screen overflow-hidden bg-gradient-to-b from-white to-emerald-50 place-items-center text-slate-950"><div className="absolute -right-24 -top-24 h-80 w-80 rounded-full border border-white/10"></div><div className="absolute -bottom-32 -left-24 h-96 w-96 rounded-full bg-emerald-500/10 blur-3xl"></div>
        <div className="relative text-center"><div className="mx-auto grid h-28 w-28 place-items-center rounded-[2.4rem] border border-emerald-600 bg-emerald-700 text-5xl font-extrabold text-white shadow-2xl shadow-emerald-700/30">M</div><h1 className="mt-7 text-4xl font-extrabold tracking-tight">Mercato</h1><p className="mt-2 text-sm text-slate-500">Thoughtful products, simply delivered.</p><div className="mx-auto mt-12 h-1 w-24 overflow-hidden rounded-full bg-emerald-100"><div className="h-full w-2/3 animate-pulse rounded-full bg-emerald-500"></div></div></div>
      </div>;

      return <main className="mx-auto flex min-h-screen max-w-md flex-col bg-[#f7faf8] px-6 py-7 shadow-2xl sm:my-6 sm:min-h-[calc(100vh-3rem)] sm:rounded-[2.5rem] sm:border sm:border-emerald-100">
        <div className="flex items-center justify-between"><Brand/><a href="index.html" className="text-sm text-slate-400">Prototype ↗</a></div>

        {screen === "login" && <section className="my-auto py-7">
          <p className="text-[10px] font-extrabold tracking-[.2em] text-emerald-600">WELCOME BACK</p><h1 className="mt-2 text-4xl font-extrabold leading-tight tracking-[-.04em]">Your next favorite<br/>is waiting.</h1><p className="mt-3 text-sm text-slate-500">Sign in with the demo account or explore as a guest.</p>
          <div className="mt-6 rounded-[1.5rem] border border-emerald-200/70 bg-gradient-to-br from-emerald-50 to-lime-50 p-4 shadow-sm">
            <div className="flex items-start justify-between gap-4">
              <div><p className="text-xs font-black uppercase tracking-wider text-emerald-700">Demo customer</p><p className="mt-2 text-sm"><span className="text-slate-500">Email:</span> <b>demo@mercato.app</b></p><p className="mt-1 text-sm"><span className="text-slate-500">Password:</span> <b>Demo123!</b></p></div>
              <button type="button" onClick={() => {setEmail("demo@mercato.app");setPassword("Demo123!");setMessage("")}} className="shrink-0 rounded-xl bg-emerald-700 px-3 py-2 text-xs font-bold text-white shadow-lg shadow-emerald-700/20">Use demo</button>
            </div>
            <p className="mt-3 text-xs leading-5 text-emerald-700/80">Prototype credentials only. No account or real authentication is involved.</p>
          </div>
          <form className="mt-6 space-y-4" onSubmit={e => submit(e, "Signed in successfully", "product.html")}>
            <label className="block text-sm font-semibold">Email<input className={fieldClass + " mt-2"} required type="email" placeholder="you@example.com" value={email} onChange={e => setEmail(e.target.value)} /></label>
            <label className="block text-sm font-semibold">Password<input className={fieldClass + " mt-2"} required minLength="6" type="password" placeholder="At least 6 characters" value={password} onChange={e => setPassword(e.target.value)} /></label>
            <div className="text-right"><button type="button" onClick={() => {setScreen("forgot");setMessage("")}} className="text-sm font-bold text-emerald-600">Forgot password?</button></div>
            {message && <p className="rounded-xl bg-emerald-50 p-3 text-sm font-semibold text-emerald-700">{message}</p>}
            <button disabled={loading} className="w-full rounded-2xl bg-emerald-700 py-4 font-extrabold text-white shadow-xl shadow-emerald-700/25 transition hover:bg-emerald-800 active:scale-[.98] disabled:opacity-60">{loading ? "Signing in…" : "Sign in →"}</button>
          </form>
          <button onClick={() => location.href="product.html"} className="mt-3 w-full rounded-2xl border border-slate-200 py-4 font-bold">Continue as guest</button>
          <p className="mt-7 text-center text-sm text-slate-500">New to Mercato? <button onClick={() => {setScreen("register");setMessage("")}} className="font-bold text-emerald-600">Create an account</button></p>
        </section>}

        {screen === "register" && <section className="my-auto py-8">
          <button onClick={() => setScreen("login")} className="mb-6 text-sm font-bold text-slate-500">← Back to sign in</button><h1 className="text-3xl font-black">Create your account</h1><p className="mt-2 text-sm text-slate-500">A quick mock registration to preview the flow.</p>
          <form className="mt-7 space-y-4" onSubmit={e => submit(e, "Account created — redirecting", "product.html")}>
            <input className={fieldClass} required placeholder="Full name" />
            <input className={fieldClass} required type="email" placeholder="Email address" />
            <input className={fieldClass} required minLength="6" type="password" placeholder="Password" />
            <input className={fieldClass} required minLength="6" type="password" placeholder="Confirm password" />
            {message && <p className="rounded-xl bg-emerald-50 p-3 text-sm font-semibold text-emerald-700">{message}</p>}
            <button disabled={loading} className="w-full rounded-2xl bg-emerald-500 py-4 font-bold text-white disabled:opacity-60">{loading ? "Creating account…" : "Create account"}</button>
          </form>
        </section>}

        {screen === "forgot" && <section className="my-auto py-10">
          <button onClick={() => {setScreen("login");setMessage("")}} className="mb-7 text-sm font-bold text-slate-500">← Back to sign in</button><div className="grid h-14 w-14 place-items-center rounded-2xl bg-amber-100 text-2xl">✉</div><h1 className="mt-5 text-3xl font-black">Reset your password</h1><p className="mt-2 text-sm leading-6 text-slate-500">Enter your email and we’ll show a mock recovery confirmation.</p>
          <form className="mt-7 space-y-4" onSubmit={e => submit(e, "Recovery instructions sent. Check your inbox.")}><input className={fieldClass} required type="email" placeholder="Email address" />{message && <p className="rounded-xl bg-emerald-50 p-3 text-sm font-semibold text-emerald-700">{message}</p>}<button disabled={loading} className="w-full rounded-2xl bg-emerald-700 py-4 font-bold text-white shadow-lg shadow-emerald-700/20 hover:bg-emerald-800 disabled:opacity-60">{loading ? "Sending…" : "Send instructions"}</button></form>
        </section>}
        <p className="text-center text-xs text-slate-400">Prototype only — do not enter real credentials.</p>
      </main>;
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
