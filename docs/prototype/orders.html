<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mercato — Orders</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><style>body{font-family:Manrope,system-ui,sans-serif}#root>div{background:#fbfaf7!important}header{background:white!important;color:#0f172a!important;border-radius:0;border-bottom:1px solid #e2e8f0}.app-header{box-sizing:border-box;height:6rem;padding:1.25rem!important}section:not([class*="bg-slate-950"]){border:0!important;box-shadow:0 12px 40px rgba(15,23,42,.08);background:white}main>button{border:0!important;background:white;box-shadow:0 12px 40px rgba(15,23,42,.08)}</style><script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script><script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script><script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script></head><body class="bg-[#e9e7e2] text-slate-950 antialiased"><div id="root"></div><script type="text/babel">
const {useState}=React;const fallback=[{id:1,name:'Minimal Watch',price:89,cartQty:1},{id:3,name:'Canvas Backpack',price:58,cartQty:2}];function loadCart(){try{const v=localStorage.getItem('mercato_cart');return v?JSON.parse(v):fallback}catch(e){return fallback}}const orders=[{id:'MC-20481',date:'Aug 18, 2026',total:205,status:'Delivered',items:3},{id:'MC-19842',date:'Jul 29, 2026',total:74,status:'Shipped',items:1},{id:'MC-18417',date:'Jun 12, 2026',total:131,status:'Delivered',items:2}];
function Icon({name}){const p={home:<><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10.5V20h14v-9.5"/></>,shop:<><path d="M4 9V20h16V9"/><path d="M3 9l2-5h14l2 5"/></>,heart:<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/>,bag:<><path d="M5 8h14l-1 13H6L5 8Z"/><path d="M9 9V6a3 3 0 0 1 6 0v3"/></>,user:<><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></>};return <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">{p[name]}</svg>}
function Nav(){return <nav className="fixed bottom-4 left-1/2 z-30 flex w-[calc(100%-2rem)] max-w-[416px] -translate-x-1/2 justify-around rounded-[1.7rem] border border-slate-200 bg-white/95 p-2 shadow-2xl backdrop-blur-xl">{[['home','Home','product.html'],['shop','Shop','product.html#shop'],['heart','Wishlist','wishlist.html'],['bag','Cart','shopping-cart.html'],['user','Profile','user-profile.html']].map(([i,l,h])=><a href={h} className="flex min-w-14 flex-col items-center gap-1 rounded-2xl px-2 py-2 text-[10px] font-bold text-slate-500"><Icon name={i}/>{l}</a>)}</nav>}
function App(){const initial=location.hash==='#history'?'history':'checkout';const [view,setView]=useState(initial),[payment,setPayment]=useState('cod'),[loading,setLoading]=useState(false),[selected,setSelected]=useState(null),cart=loadCart();const subtotal=cart.reduce((s,x)=>s+x.price*x.cartQty,0),delivery=4,total=subtotal+delivery;const place=e=>{e.preventDefault();setLoading(true);setTimeout(()=>{setLoading(false);setView('confirmation')},800)};
if(view==='confirmation')return <div className="mx-auto grid min-h-screen max-w-md place-items-center bg-white px-7 text-center shadow-xl"><div><div className="mx-auto grid h-24 w-24 place-items-center rounded-full bg-emerald-100 text-4xl text-emerald-600">✓</div><p className="mt-7 text-xs font-bold tracking-widest text-emerald-600">ORDER CONFIRMED</p><h1 className="mt-2 text-3xl font-black">Thank you for your order!</h1><p className="mt-3 leading-6 text-slate-500">Your mock order <b className="text-slate-900">#MC-21809</b> has been received.</p><div className="mt-7 rounded-3xl bg-slate-50 p-5 text-left"><div className="flex justify-between text-sm"><span className="text-slate-500">Total</span><b>${total.toFixed(2)}</b></div><div className="mt-3 flex justify-between text-sm"><span className="text-slate-500">Payment</span><b>{payment==='cod'?'Cash on delivery':'Mock card'}</b></div></div><button onClick={()=>setView('history')} className="mt-7 w-full rounded-2xl bg-slate-950 py-4 font-bold text-white">View order history</button><a href="product.html" className="mt-3 block py-3 text-sm font-bold text-emerald-600">Continue shopping</a></div></div>;
if(view==='detail'&&selected)return <div className="mx-auto min-h-screen max-w-md bg-white pb-24 shadow-xl"><header className="app-header flex items-center gap-4"><button onClick={()=>setView('history')} className="grid h-10 w-10 place-items-center rounded-xl border border-slate-200 bg-slate-50 font-bold">←</button><div><p className="text-xs font-bold text-emerald-600">ORDER DETAILS</p><h1 className="text-2xl font-black">#{selected.id}</h1></div></header><main className="px-5 pt-6"><div className="mb-5 flex items-center justify-between text-sm"><span className="text-slate-500">{selected.date}</span><span className="rounded-full bg-emerald-100 px-3 py-1 font-bold text-emerald-700">{selected.status}</span></div><section className="rounded-3xl bg-slate-50 p-5"><h2 className="font-black">Shipment progress</h2><div className="mt-5 flex justify-between text-center text-xs"><div><b className="mx-auto block h-4 w-4 rounded-full bg-emerald-500"></b><span className="mt-2 block">Confirmed</span></div><div><b className="mx-auto block h-4 w-4 rounded-full bg-emerald-500"></b><span className="mt-2 block">Shipped</span></div><div><b className={'mx-auto block h-4 w-4 rounded-full '+(selected.status==='Delivered'?'bg-emerald-500':'bg-slate-300')}></b><span className="mt-2 block">Delivered</span></div></div></section><section className="mt-5 rounded-3xl border border-slate-100 p-5"><h2 className="font-black">Order summary</h2><div className="mt-4 flex justify-between text-sm text-slate-500"><span>{selected.items} products</span><b className="text-slate-900">${selected.total.toFixed(2)}</b></div><div className="mt-4 border-t pt-4 text-sm"><p className="font-bold">Delivery address</p><p className="mt-1 text-slate-500">12 Riverside Street, Phnom Penh</p></div><div className="mt-4 border-t pt-4 text-sm"><p className="font-bold">Payment</p><p className="mt-1 text-slate-500">Cash on delivery</p></div></section></main><Nav/></div>;
if(view==='history')return <div className="mx-auto min-h-screen max-w-md bg-white pb-28 shadow-xl"><header className="app-header"><div><p className="text-xs font-bold text-emerald-600">YOUR PURCHASES</p><h1 className="text-2xl font-black">Order history</h1></div></header><main className="space-y-4 px-5">{orders.map(o=><button key={o.id} onClick={()=>{setSelected(o);setView('detail')}} className="w-full rounded-3xl border border-slate-100 p-5 text-left shadow-sm"><div className="flex justify-between"><div><p className="font-black">#{o.id}</p><p className="mt-1 text-xs text-slate-400">{o.date} · {o.items} items</p></div><span className="h-fit rounded-full bg-emerald-50 px-3 py-1 text-xs font-bold text-emerald-700">{o.status}</span></div><div className="mt-5 flex items-center justify-between border-t border-slate-100 pt-4"><b>${o.total.toFixed(2)}</b><span className="text-sm text-slate-400">View details →</span></div></button>)}</main><Nav/></div>;
return <div className="mx-auto min-h-screen max-w-md bg-white pb-24 shadow-xl"><header className="app-header flex items-center justify-between"><div><p className="text-xs font-bold text-emerald-600">FINAL STEP</p><h1 className="text-2xl font-black">Checkout</h1></div><a href="shopping-cart.html" className="text-sm font-bold text-slate-500">← Cart</a></header><form onSubmit={place} className="space-y-5 px-5"><section className="rounded-3xl border border-slate-100 p-5"><h2 className="font-black">Contact & delivery</h2><div className="mt-4 space-y-3"><input required className="w-full rounded-2xl bg-slate-50 px-4 py-3 outline-none focus:ring-2 focus:ring-emerald-500" placeholder="Full name" defaultValue="Alex Morgan"/><input required type="email" className="w-full rounded-2xl bg-slate-50 px-4 py-3 outline-none focus:ring-2 focus:ring-emerald-500" placeholder="Email" defaultValue="alex@example.com"/><textarea required className="w-full rounded-2xl bg-slate-50 px-4 py-3 outline-none focus:ring-2 focus:ring-emerald-500" placeholder="Delivery address" defaultValue="12 Riverside Street, Phnom Penh"></textarea></div></section><section className="rounded-3xl border border-slate-100 p-5"><h2 className="font-black">Delivery method</h2><label className="mt-4 flex cursor-pointer items-center justify-between rounded-2xl bg-emerald-50 p-4"><span><b className="block">Standard delivery</b><small className="text-slate-500">2–4 business days</small></span><span className="font-black">$4.00</span></label></section><section className="rounded-3xl border border-slate-100 p-5"><h2 className="font-black">Payment method</h2><div className="mt-4 grid grid-cols-2 gap-3">{[['cod','Cash on delivery'],['card','Credit / debit card']].map(([id,name])=><button type="button" onClick={()=>setPayment(id)} className={(payment===id?'border-emerald-500 bg-emerald-50':'border-slate-200')+' rounded-2xl border p-4 text-left text-sm font-bold'}>{name}</button>)}</div>{payment==='card'&&<p className="mt-3 rounded-xl bg-amber-50 p-3 text-xs text-amber-700">Prototype only—no card details are collected.</p>}</section><section className="rounded-3xl bg-slate-950 p-5 text-white"><h2 className="font-black">Order summary</h2><div className="mt-4 space-y-2 text-sm text-slate-400">{cart.map(x=><div className="flex justify-between"><span>{x.cartQty} × {x.name}</span><span>${(x.price*x.cartQty).toFixed(2)}</span></div>)}<div className="flex justify-between"><span>Delivery</span><span>${delivery.toFixed(2)}</span></div></div><div className="my-4 border-t border-slate-700"></div><div className="flex justify-between text-xl font-black"><span>Total</span><span>${total.toFixed(2)}</span></div><button disabled={loading} className="mt-5 w-full rounded-2xl bg-emerald-400 py-4 font-black text-slate-950 disabled:opacity-60">{loading?'Placing order…':'Place mock order'}</button></section></form></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script><style>
/* Mercato palette: emerald actions, slate typography, warm off-white surfaces. */
body{background:#dfe9e3!important;color:#0f172a}
#root>div{background:#f7faf8!important}
form{padding-top:1.5rem}
main.space-y-4{padding-top:1.5rem}
section.bg-slate-950{background:#fff!important;color:#0f172a!important;box-shadow:0 12px 40px rgba(15,23,42,.08)}
section.bg-slate-950 .text-slate-400{color:#64748b!important}
section.bg-slate-950 .border-slate-700{border-color:#e2e8f0!important}
section.bg-slate-950 .bg-emerald-400{background:#047857!important;color:#fff!important}
button.bg-slate-950{background:#047857!important;color:#fff!important;box-shadow:0 10px 24px rgba(4,120,87,.24)}
button.bg-slate-950:hover{background:#065f46!important}
</style></body></html>
