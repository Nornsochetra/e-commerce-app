<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FAFAF8" />
  <title>Mercato — My orders</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/mercato.css" />

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

  <!-- Shared data, navigation and UI components (ScreenLayout, AppHeader, TabBar, ProductCard, …) -->
  <script src="assets/mercato.js"></script>
</head>
<body>
<div id="root"></div>

<!-- Screen: Order history -->
<script type="text/babel">
/* SCR-017 Order history with All / In progress / Delivered filters. Reached from Profile. */
function OrdersScreen({ goBack }) {
  const to = Mercato.to;
  const loading = useLoading(300);
  const [filter, setFilter] = React.useState('all');
  const orders = Mercato.getOrders();
  const active = orders.filter(o => o.status !== 'delivered').length;
  const shown = orders.filter(o => filter === 'all' || (filter === 'active' ? o.status !== 'delivered' : o.status === 'delivered'));
  const filters = [['all', 'All', orders.length], ['active', 'In progress', active], ['delivered', 'Delivered', orders.length - active]];

  return <ScreenLayout active="profile" header={<AppHeader title="My Orders" onBack={() => goBack(to.profile)} />}>
    {orders.length > 0 && <div className="chips no-scrollbar mb-4" role="group" aria-label="Filter orders">
      {filters.map(([v, t, n]) => <button key={v} className="chip" aria-pressed={filter === v} onClick={() => setFilter(v)}>{t}<span className="count">{n}</span></button>)}
    </div>}
    {loading ? <ListSkeleton count={2} />
      : shown.length ? <ul>{shown.map(o => {
        const imgs = o.items.slice(0, 3), extra = o.items.length - imgs.length, n = Mercato.orderItemCount(o);
        return <li key={o.id} className="order-card" style={{ padding: 0 }}><a href={to.order(o.id)} className="block" style={{ padding: 16 }}>
          <div className="flex items-start justify-between gap-3">
            <div><p className="t-head">Order #{o.reference}</p><p className="t-meta mt-0.5">{Mercato.fmtDate(o.createdAt)} · {n} {n === 1 ? 'item' : 'items'}</p></div>
            <OrderStatusBadge status={o.status} />
          </div>
          <div className="flex items-center justify-between mt-4">
            <div className="thumb-stack">{imgs.map(i => <ProductImage key={i.productId} src={orderItemImage(i)} alt="" className="thumb" />)}{extra > 0 && <span className="thumb-more">+{extra}</span>}</div>
            <span className="flex items-center gap-1.5"><b className="t-price">{Mercato.money(o.total)}</b><Icon name="chevron" size={18} className="faint" /></span>
          </div>
        </a></li>;
      })}</ul>
      : orders.length ? <EmptyState icon="box" title="Nothing here" text={filter === 'active' ? 'You have no orders in progress.' : 'No delivered orders yet.'} action={<button className="btn btn-outline" onClick={() => setFilter('all')}>Show all orders</button>} />
      : <EmptyState icon="box" title="No orders yet" text="Orders you place will appear here so you can track them." action={<a href={to.shop()} className="btn btn-primary">Start shopping</a>} />}
  </ScreenLayout>;
}

Mercato.mount(OrdersScreen);
</script>
</body>
</html>
