<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FAFAF8" />
  <title>APM — Product</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/mercato.css" />

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

  <!-- Shared data, navigation and UI components (ScreenLayout, AppHeader, TabBar, ProductCard, …) -->
  <script src="assets/mercato.js"></script>
</head>
<body>
<div id="root"></div>

<!-- Screen: Product details -->
<script type="text/babel">
/* SCR-010 Product details. Opened as product.html?id=<productId>. Add to cart lives in a sticky dock within thumb reach. */
function ProductDetailScreen({ params, goBack }) {
  const to = Mercato.to;
  const p = Mercato.productById(params.id);
  const [qty, setQty] = React.useState(1);
  if (!p) return <ScreenLayout nav={false} header={<AppHeader title="Product" onBack={() => goBack(to.shop())} />}>
    <EmptyState icon="search" title="Product not found" text="This product may no longer be available." action={<a href={to.shop()} className="btn btn-primary">Browse products</a>} />
  </ScreenLayout>;

  const favorites = new Set(Mercato.getWishlist().map(x => x.id));
  const fav = favorites.has(p.id);
  const inCart = (Mercato.getCart().items.find(i => i.product.id === p.id) || {}).quantity || 0;
  const related = Mercato.products.filter(x => x.category.name === p.category.name && x.id !== p.id);
  const suggestions = (related.length ? related : Mercato.products.filter(x => x.id !== p.id && x.featured)).slice(0, 2);
  const low = p.availableQuantity > 0 && p.availableQuantity <= 5;
  const lineTotal = Mercato.usd(Number(p.price.amount) * qty);

  const dock = p.availableQuantity
    ? <><QtyStepper value={qty} max={p.availableQuantity} onChange={setQty} />
        <button className="btn btn-primary" onClick={() => Mercato.addWithFeedback(p, qty)}>Add to cart · {Mercato.money(lineTotal)}</button></>
    : <><div className="dock-meta"><b>Out of stock</b><small>Save it to your wishlist for later</small></div>
        <button className="btn btn-secondary" onClick={() => Mercato.favoriteWithFeedback(p)}>{fav ? 'Saved' : 'Save for later'}</button></>;

  return <ScreenLayout nav={false} bare dock={dock}>
    <div className="detail-media">
      <ProductImage src={p.imageUrl} alt={p.name} />
      <div className="float-top">
        <BackButton onBack={() => goBack(to.shop())} label="Back" className="circle-btn on-media" />
        <FavButton product={p} favorite={fav} onFavorite={Mercato.favoriteWithFeedback} className="circle-btn on-media" />
      </div>
    </div>

    <div className="flex items-center gap-2 mt-5">
      <span className="t-eyebrow">{p.category.name}</span>
      {p.badges.map(b => <span key={b} className="badge neutral">{Mercato.label(b)}</span>)}
    </div>
    <h1 className="t-display mt-2">{p.name}</h1>
    <div className="flex items-center gap-3 mt-2">
      <span className="rating" style={{ fontSize: 14 }}><Icon name="star" size={16} fill />{p.rating || 'Not rated'}</span>
      <span className="faint">•</span>
      <span className={'badge ' + (!p.availableQuantity ? 'error' : low ? 'warning' : 'success')}>{!p.availableQuantity ? 'Out of stock' : low ? 'Only ' + p.availableQuantity + ' left' : 'In stock'}</span>
    </div>
    <p className="mt-4"><span className="t-price" style={{ fontSize: 28, lineHeight: '34px' }}>{Mercato.money(p.price)}</span> <span className="t-meta">/ each</span></p>
    <p className="t-body muted mt-3">{p.description || 'No description has been added for this product yet.'}</p>

    <ul className="highlights card tint mt-5">
      <li><span className="icon-tile" style={{ background: '#fff' }}><Icon name="truck" size={20} /></span><span>Standard delivery in 2–4 business days <span className="muted">· {Mercato.money(Mercato.DELIVERY_FEE)}</span></span></li>
      <li><span className="icon-tile" style={{ background: '#fff' }}><Icon name="cash" size={20} /></span><span>Pay with cash on delivery</span></li>
    </ul>

    <div className="mt-5">
      <details className="accordion"><summary>Product details<Icon name="chevron" size={18} /></summary>
        <div className="acc-body"><dl><dt>Category</dt><dd>{p.category.name}</dd><dt>Availability</dt><dd>{p.availableQuantity ? p.availableQuantity + ' in stock' : 'Out of stock'}</dd><dt>Rating</dt><dd>{p.rating || '–'} / 5</dd><dt>Currency</dt><dd>USD</dd></dl></div>
      </details>
      <details className="accordion"><summary>Delivery & payment<Icon name="chevron" size={18} /></summary>
        <div className="acc-body">Orders ship by standard delivery in 2–4 business days for a flat {Mercato.money(Mercato.DELIVERY_FEE)}. Cash on delivery is the only payment method in this version.</div>
      </details>
    </div>

    {inCart > 0 && <a href={to.cart} className="banner mt-5"><span className="icon-tile"><Icon name="bag" size={20} /></span><span className="flex-1 t-body"><b>{inCart}</b> already in your cart</span><span className="link">View cart</span></a>}

    {suggestions.length > 0 && <>
      <div className="section-head"><h2 className="t-section">You may also like</h2></div>
      <div className="grid-2">{suggestions.map(r => <ProductCard key={r.id} product={r} favorite={favorites.has(r.id)} onFavorite={Mercato.favoriteWithFeedback} onAdd={Mercato.addWithFeedback} />)}</div>
    </>}
  </ScreenLayout>;
}

Mercato.mount(ProductDetailScreen);
</script>
</body>
</html>
