<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mercato — Products</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <style>body{font-family:Manrope,system-ui,sans-serif}.no-scrollbar::-webkit-scrollbar{display:none}</style>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script><script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#e9e7e2] text-slate-950 antialiased"><div id="root"></div>
<script type="text/babel">
  const {useMemo,useState}=React;
  const products=[
    {id:1,name:"Minimal Watch",category:"Accessories",price:89,rating:4.8,stock:8,image:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=700&q=80",description:"A quiet, refined watch designed for everyday wear."},
    {id:2,name:"Cloud Sneakers",category:"Footwear",price:74,rating:4.6,stock:12,image:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=700&q=80"},
    {id:3,name:"Canvas Backpack",category:"Bags",price:58,rating:4.7,stock:5,image:"https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=700&q=80",description:"Durable canvas storage with a comfortable everyday silhouette."},
    {id:4,name:"Studio Headphones",category:"Electronics",price:129,rating:4.9,stock:0,image:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=700&q=80",description:"Immersive sound with a lightweight over-ear design."},
    {id:5,name:"Classic Sunglasses",category:"Accessories",price:42,rating:4.5,stock:16,image:"https://images.unsplash.com/photo-1511499767150-a48a237f0083?auto=format&fit=crop&w=700&q=80"},
    {id:6,name:"Everyday Camera",category:"Electronics",price:245,rating:4.7,stock:3,image:"https://images.unsplash.com/photo-1516035069371-29a1b244cc32?auto=format&fit=crop&w=700&q=80",description:"A compact camera for documenting the moments that matter."}
  ];
  const categories=["All","Accessories","Footwear","Bags","Electronics"];
  function save(key,value){try{localStorage.setItem(key,JSON.stringify(value))}catch(e){}}
  function load(key,fallback=[]){try{return JSON.parse(localStorage.getItem(key))||fallback}catch(e){return fallback}}
  function Icon({name}){const paths={home:<><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10.5V20h14v-9.5"/><path d="M9 20v-6h6v6"/></>,shop:<><path d="M4 9V20h16V9"/><path d="M3 9l2-5h14l2 5"/><path d="M8 13h8"/></>,heart:<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/>,bell:<><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></>,bag:<><path d="M5 8h14l-1 13H6L5 8Z"/><path d="M9 9V6a3 3 0 0 1 6 0v3"/></>,user:<><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></>};return <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">{paths[name]}</svg>}
  function Nav({active="home",onHome,onShop}){const cartCount=load("mercato_cart").reduce((sum,item)=>sum+(item.cartQty||0),0);return <nav className="fixed bottom-4 left-1/2 z-40 flex w-[calc(100%-2rem)] max-w-[416px] -translate-x-1/2 justify-around rounded-[1.7rem] border border-slate-200 bg-white/95 p-2 shadow-xl shadow-slate-950/10 backdrop-blur-xl">
    {[['home','Home','product.html','home'],['shop','Shop','product.html#shop','shop'],['heart','Wishlist','wishlist.html','wishlist'],['bag','Cart','shopping-cart.html','cart'],['user','Profile','user-profile.html','profile']].map(([icon,label,href,id])=><a key={id} href={href} onClick={id==='home'&&onHome?e=>{e.preventDefault();onHome()}:id==='shop'&&onShop?e=>{e.preventDefault();onShop()}:undefined} className={(active===id?'bg-emerald-50 text-emerald-700':'text-slate-500')+' flex min-w-14 flex-col items-center gap-1 rounded-2xl px-2 py-2 text-[10px] font-bold transition'}><span className="relative"><Icon name={icon}/>{id==='cart'&&cartCount>0&&<span className="absolute -right-2.5 -top-2.5 grid min-w-4 h-4 place-items-center rounded-full bg-emerald-700 px-1 text-[8px] font-extrabold leading-none text-white ring-2 ring-white">{cartCount>99?'99+':cartCount}</span>}</span>{label}</a>)}
  </nav>}
  function App(){
    const [view,setView]=useState(location.hash==="#shop"?"shop":"home"); const [query,setQuery]=useState(""); const [category,setCategory]=useState("All"); const [sort,setSort]=useState("featured"); const [filters,setFilters]=useState(false); const [selected,setSelected]=useState(null); const [qty,setQty]=useState(1); const [toast,setToast]=useState(""); const [favorites,setFavorites]=useState(load("mercato_wishlist"));
    const shown=useMemo(()=>{let list=products.filter(p=>(category==="All"||p.category===category)&&p.name.toLowerCase().includes(query.toLowerCase())); if(sort==="low")list.sort((a,b)=>a.price-b.price);if(sort==="high")list.sort((a,b)=>b.price-a.price);if(sort==="rating")list.sort((a,b)=>b.rating-a.rating);return list},[query,category,sort]);
    const cartCount=load("mercato_cart").reduce((sum,item)=>sum+(item.cartQty||0),0);
    const notice=text=>{setToast(text);setTimeout(()=>setToast(""),1800)};
    const toggleFavorite=p=>{const exists=favorites.some(x=>x.id===p.id);const next=exists?favorites.filter(x=>x.id!==p.id):[...favorites,p];setFavorites(next);save("mercato_wishlist",next);notice(exists?"Removed from wishlist":"Saved to wishlist")};
    const add=p=>{if(!p.stock)return;const cart=load("mercato_cart");const found=cart.find(x=>x.id===p.id);const next=found?cart.map(x=>x.id===p.id?{...x,cartQty:Math.min(x.cartQty+qty,p.stock)}:x):[...cart,{...p,cartQty:qty}];save("mercato_cart",next);notice("Added to cart")};
    const openHome=()=>{setView("home");setCategory("All");setQuery("");history.replaceState(null,"",location.pathname)}; const openShop=()=>{setView("shop");history.replaceState(null,"",location.pathname+"#shop")};
    if(selected)return <div className="mx-auto min-h-screen max-w-md bg-[#fbfaf7] pb-32 shadow-2xl"><div className="relative overflow-hidden rounded-b-[2.5rem]"><img src={selected.image} className="h-[26rem] w-full object-cover"/><div className="absolute inset-0 bg-gradient-to-t from-slate-950/45 via-transparent to-slate-950/10"></div><button onClick={()=>{setSelected(null);setQty(1)}} className="absolute left-5 top-5 grid h-11 w-11 place-items-center rounded-full border border-white/40 bg-white/80 font-bold shadow-lg backdrop-blur">←</button><button onClick={()=>toggleFavorite(selected)} className="absolute right-5 top-5 grid h-11 w-11 place-items-center rounded-full border border-white/40 bg-white/80 text-xl text-rose-500 shadow-lg backdrop-blur">{favorites.some(x=>x.id===selected.id)?'♥':'♡'}</button><span className="absolute bottom-5 left-5 rounded-full bg-white/85 px-3 py-1.5 text-xs font-extrabold backdrop-blur">Premium pick</span></div><section className="px-6 py-7"><div className="flex items-start justify-between gap-4"><div><p className="text-xs font-extrabold uppercase tracking-[.18em] text-emerald-600">{selected.category}</p><h1 className="mt-2 text-3xl font-extrabold tracking-tight">{selected.name}</h1></div><p className="text-2xl font-extrabold">${selected.price}</p></div><div className="mt-4 flex gap-3 text-sm"><span className="rounded-full bg-amber-50 px-3 py-1.5 font-bold text-amber-600">★ {selected.rating}</span><span className={(selected.stock?'bg-emerald-50 text-emerald-700':'bg-rose-50 text-rose-700')+' rounded-full px-3 py-1.5 font-bold'}>{selected.stock?`${selected.stock} in stock`:'Out of stock'}</span></div>{selected.description&&<p className="mt-6 leading-7 text-slate-600">{selected.description}</p>}<div className="mt-8 flex items-end justify-between gap-4"><div><p className="text-xs font-extrabold uppercase tracking-wider text-slate-400">Quantity</p><div className="mt-2 flex items-center rounded-2xl border border-slate-200 bg-white shadow-sm"><button disabled={qty===1} onClick={()=>setQty(q=>q-1)} className="px-4 py-3 disabled:opacity-30">−</button><b className="min-w-8 text-center">{qty}</b><button disabled={qty>=selected.stock} onClick={()=>setQty(q=>q+1)} className="px-4 py-3 disabled:opacity-30">+</button></div></div><button disabled={!selected.stock} onClick={()=>add(selected)} className="flex-1 rounded-2xl bg-slate-950 px-6 py-4 font-extrabold text-white shadow-xl shadow-slate-950/20 transition active:scale-[.98] disabled:bg-slate-300">{selected.stock?'Add to cart':'Unavailable'}</button></div></section>{toast&&<div className="fixed left-1/2 top-5 z-50 -translate-x-1/2 rounded-full bg-slate-950 px-5 py-3 text-sm font-bold text-white shadow-xl">{toast}</div>}<Nav active={view} onHome={openHome} onShop={openShop}/></div>;
    return <div className="mx-auto min-h-screen max-w-md bg-[#fbfaf7] pb-32 shadow-2xl"><header className="flex h-24 items-center justify-between gap-3 border-b border-slate-200 bg-white px-5"><div className="min-w-0"><p className="text-[10px] font-bold tracking-[.2em] text-emerald-600">{view==='home'?'GOOD MORNING, ALEX':'THE FULL COLLECTION'}</p><h1 className="mt-1 truncate text-2xl font-extrabold tracking-tight">{view==='home'?'Find something special':'Shop all products'}</h1></div><div className="flex shrink-0 gap-2"><a href="notifications.html" className="relative grid h-11 w-11 place-items-center rounded-2xl border border-slate-200 bg-slate-50" aria-label="Notifications"><Icon name="bell"/><span className="absolute right-2 top-2 h-2 w-2 rounded-full bg-rose-500 ring-2 ring-white"></span></a><a href="shopping-cart.html" className="relative grid h-11 w-11 place-items-center rounded-2xl border border-slate-200 bg-slate-50" aria-label="Shopping cart"><Icon name="bag"/>{cartCount>0&&<span className="absolute -right-1.5 -top-1.5 grid h-5 min-w-5 place-items-center rounded-full bg-emerald-700 px-1 text-[9px] font-extrabold text-white ring-2 ring-white">{cartCount>99?'99+':cartCount}</span>}</a></div></header>
      <main className="px-5 py-6">{view==='shop'&&<section className="mb-7"><label className="flex items-center gap-3 rounded-2xl border border-slate-200 bg-white px-4 py-3.5 text-slate-500 shadow-sm"><span className="text-xl">⌕</span><input value={query} onFocus={openShop} onChange={e=>{setQuery(e.target.value);openShop()}} className="w-full bg-transparent text-sm outline-none" placeholder="Search the collection"/></label></section>}{view==='home'?<><section className="relative overflow-hidden rounded-[2rem] border border-slate-200 bg-white p-6 shadow-lg shadow-emerald-900/10"><div className="relative z-10 w-3/5"><p className="text-[10px] font-extrabold uppercase tracking-[.22em] text-emerald-900/60">New season · 2026</p><h2 className="mt-2 text-2xl font-extrabold leading-tight">Objects worth keeping.</h2><button onClick={openShop} className="mt-5 rounded-xl bg-slate-950 px-4 py-2.5 text-xs font-bold text-white shadow-lg">Explore collection</button></div><div className="absolute -bottom-12 -right-10 h-44 w-44 rotate-12 rounded-[2.5rem] bg-white/35 shadow-2xl"></div><img src={products[1].image} className="absolute -bottom-3 -right-3 h-36 w-36 rotate-[-8deg] rounded-[2rem] object-cover shadow-2xl"/></section><div className="mt-8 flex items-center justify-between"><div><p className="text-[10px] font-extrabold uppercase tracking-[.18em] text-emerald-600">Find your style</p><h2 className="text-xl font-extrabold">Browse categories</h2></div><button onClick={openShop} className="rounded-full bg-white px-3 py-2 text-xs font-bold shadow-sm">View all →</button></div><div className="no-scrollbar mt-4 flex gap-3 overflow-x-auto pb-2">{categories.filter(c=>c!=="All").map((c,i)=><button key={c} onClick={()=>{setCategory(c);openShop()}} className={['border border-slate-200 bg-white','border border-slate-200 bg-white','border border-slate-200 bg-white','border border-slate-200 bg-white'][i]+' min-w-32 rounded-3xl px-4 py-5 text-left shadow-sm'}><span className="text-2xl">{['◉','↗','▰','◫'][i]}</span><b className="mt-5 block text-sm">{c}</b><small className="text-slate-500">Explore →</small></button>)}</div></>:<><div className="flex items-center justify-between"><div><p className="text-[10px] font-extrabold uppercase tracking-[.18em] text-emerald-600">Curated catalog</p><h2 className="text-xl font-extrabold">Shop by category</h2></div><div className="flex items-center gap-2"><span className="text-xs font-bold text-slate-400">{shown.length} items</span><button onClick={()=>setFilters(true)} className="rounded-xl border border-slate-200 bg-white px-3 py-2 text-xs font-bold shadow-sm">Filters</button></div></div><div className="no-scrollbar mt-4 flex gap-2 overflow-x-auto pb-2">{categories.map(c=><button key={c} onClick={()=>setCategory(c)} className={(category===c?'bg-slate-950 text-white shadow-lg':'bg-white text-slate-600 shadow-sm')+' whitespace-nowrap rounded-full px-4 py-2.5 text-xs font-bold transition'}>{c}</button>)}</div></>}
      <div className="mt-7 flex items-end justify-between"><div><p className="text-xs font-bold text-emerald-600">{view==='home'?'CURATED FOR YOU':'CATALOG'}</p><h2 className="text-xl font-black">{view==='home'?'Popular products':query?`Results for “${query}”`:category==="All"?'All products':category}</h2></div><select value={sort} onChange={e=>setSort(e.target.value)} className="rounded-xl bg-slate-100 p-2 text-xs font-bold outline-none"><option value="featured">Featured</option><option value="low">Price ↑</option><option value="high">Price ↓</option><option value="rating">Rating</option></select></div>
      {shown.length?<div className="mt-4 grid grid-cols-2 gap-4">{shown.map((p,i)=><article key={p.id} className="group overflow-hidden rounded-[1.6rem] bg-white shadow-[0_10px_35px_rgba(15,23,42,.07)]"><button className="relative block w-full overflow-hidden" onClick={()=>{setSelected(p);setQty(1)}}><img src={p.image} className="h-48 w-full object-cover transition duration-500 group-hover:scale-105"/><span className="absolute left-3 top-3 rounded-full bg-white/85 px-2.5 py-1 text-[10px] font-extrabold backdrop-blur">{i%2?'BESTSELLER':'NEW'}</span>{!p.stock&&<span className="absolute inset-x-3 bottom-3 rounded-xl bg-slate-950/85 py-2 text-xs font-bold text-white backdrop-blur">Out of stock</span>}</button><div className="p-4"><div className="flex gap-2"><button onClick={()=>{setSelected(p);setQty(1)}} className="min-w-0 flex-1 text-left"><p className="truncate text-sm font-extrabold">{p.name}</p><p className="mt-1 text-[11px] font-semibold text-amber-500">★ {p.rating} <span className="text-slate-400">· {p.stock} left</span></p></button><button onClick={()=>toggleFavorite(p)} className="grid h-8 w-8 place-items-center rounded-full bg-rose-50 text-lg text-rose-500">{favorites.some(x=>x.id===p.id)?'♥':'♡'}</button></div><div className="mt-3 flex items-center justify-between"><p className="font-extrabold">${p.price}</p><button disabled={!p.stock} onClick={()=>add(p)} className="grid h-8 w-8 place-items-center rounded-full bg-slate-950 text-sm font-bold text-white disabled:bg-slate-300">+</button></div></div></article>)}</div>:<div className="mt-12 rounded-[2rem] bg-white p-8 text-center shadow-sm"><div className="text-4xl">⌕</div><h3 className="mt-3 font-extrabold">No products found</h3><p className="mt-1 text-sm text-slate-500">Try another search or clear your filters.</p><button onClick={()=>{setQuery("");setCategory("All")}} className="mt-4 text-sm font-bold text-emerald-600">Clear search</button></div>}</main>
      {filters&&<div className="fixed inset-0 z-50 flex items-end justify-center bg-slate-950/40"><div className="w-full max-w-md rounded-t-[2rem] bg-white p-6"><div className="flex justify-between"><h2 className="text-2xl font-black">Filter products</h2><button onClick={()=>setFilters(false)} className="text-xl">×</button></div><p className="mt-6 text-sm font-bold">Category</p><div className="mt-3 flex flex-wrap gap-2">{categories.map(c=><button key={c} onClick={()=>setCategory(c)} className={(category===c?'bg-emerald-500 text-white':'bg-slate-100')+' rounded-full px-4 py-2 text-sm font-bold'}>{c}</button>)}</div><p className="mt-6 text-sm font-bold">Availability</p><div className="mt-3 rounded-2xl bg-slate-50 p-4 text-sm text-slate-500">In-stock filtering will be finalized with catalog rules.</div><button onClick={()=>setFilters(false)} className="mt-6 w-full rounded-2xl bg-slate-950 py-4 font-bold text-white">Show {shown.length} products</button></div></div>}
      {toast&&<div className="fixed left-1/2 top-5 z-50 -translate-x-1/2 rounded-full bg-slate-950 px-5 py-3 text-sm font-bold text-white shadow-xl">{toast}</div>}<Nav active={view} onHome={openHome} onShop={openShop}/></div>;
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script><style>
  /* Mercato palette: emerald actions, slate typography, warm off-white surfaces. */
  body{background:#dfe9e3!important;color:#0f172a}
  #root>div{background:#f7faf8!important}
  .bg-slate-950{background-color:#047857!important}
  .bg-slate-950 .text-slate-400{color:#d1fae5!important}
  .bg-rose-50{background-color:#ecfdf5!important}
  .bg-rose-100{background-color:#d1fae5!important}
  .bg-rose-500{background-color:#059669!important}
  .text-rose-500,.text-rose-600,.text-rose-700{color:#047857!important}
</style></body></html>
