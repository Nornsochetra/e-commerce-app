spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/e-commerce}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:1234}
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    # db/dev holds development-only seed data (sample catalog); never loaded outside the dev profile.
    locations: classpath:db/migration,classpath:db/dev

app:
  cors:
    # Any localhost port in dev: Flutter web (`flutter run -d chrome`) picks a random port each run.
    # Set CORS_ALLOWED_ORIGINS to override; other profiles keep the exact list from application.yml.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
