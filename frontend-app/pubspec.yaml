name: frontend_app
description: "Mercato mobile e-commerce app (Flutter UI)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1            # app state (providers/)
  go_router: ^17.5.0            # navigation (router.dart)
  shared_preferences: ^2.5.6    # saves mock cart, wishlist, orders, profile on the device
  intl: ^0.20.3                 # money and date formatting
  flutter_svg: ^2.3.0           # shows the SVG logo and icons in assets/icons
  dio: ^5.11.1                  # HTTP client for the Spring API (services/api/)
  flutter_secure_storage: ^11.2.0 # keeps the sign-in tokens in the Keychain / Keystore

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:             # drives the app on the simulator for review screenshots
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Images that don't come from the API (product photos do, so they stay as URLs)
  assets:
    - assets/images/banners/     # Home carousel photos (credits: assets/images/CREDITS.md)
    - assets/icons/              # logo, category icons, image placeholder (SVG)

  # Manrope (SIL Open Font License, see assets/fonts/OFL.txt)
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
